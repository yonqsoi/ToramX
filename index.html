<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ToramX</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <!-- Material Icons for that premium feel -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

  <!-- PWA Update Banner (Hidden by default) -->
  <div id="update-banner" class="update-banner">
    <p>New version of ToramX is ready!</p>
    <button id="update-btn">Update Now</button>
  </div>

  <!-- Header Section: Gamification / Status -->
  <header class="app-header">
    <div class="logo">Toram<span>X</span></div>
    <div class="user-status">
      <span class="rank">Adventurer</span>
      <span class="points"><i class="material-icons">stars</i> 1,250</span>
    </div>
  </header>

  <!-- Main Content Areas -->
  <main id="app-content">
    <section id="feed" class="view active">
      <div class="placeholder-card">Feed: Toram Content Only</div>
    </section>
    
    <section id="lfp" class="view">
      <div class="placeholder-card">Looking For Party (LFP)</div>
    </section>

    <section id="trade" class="view">
      <div class="placeholder-card">Marketplace: Buy / Sell</div>
    </section>

    <section id="profile" class="view">
      <div class="placeholder-card">User Profile & Settings</div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-view="feed">
      <i class="material-icons">home</i>
      <span>Feed</span>
    </div>
    <div class="nav-item" data-view="lfp">
      <i class="material-icons">groups</i>
      <span>LFP</span>
    </div>
    <div class="nav-item" data-view="trade">
      <i class="material-icons">storefront</i>
      <span>Trade</span>
    </div>
    <div class="nav-item" data-view="profile">
      <i class="material-icons">person</i>
      <span>Profile</span>
    </div>
  </nav>

  <script src="app.js"></script>
</body>
</html>
